<body>
    <div id="app">

    <!-- 业务 JS -->
    <script>
        /* ==========================================================================
           如何新增一个页面：
           1. 在 router 配置中添加新路由 (path, component)
           2. 定义新的组件（参考 Home / Loading 组件）
           3. 若需底部 Tab，在 App 根组件或 Layout 中添加 tab 项，并更新 tab-bar 样式
           4. 确保新页面通过 <router-view> 渲染
           ========================================================================== */

        const { createApp, ref, onMounted, computed, watch } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;

        // -------------------------------------------------------------------------
        // Shared/Global State (simple approach for this single-file app)
        // -------------------------------------------------------------------------
        const fingerprint = ref(''); // will be set by Loading component

        // -------------------------------------------------------------------------
        // Loading Component
        // -------------------------------------------------------------------------
        const LoadingPage = {
            name: 'LoadingPage',
            template: `
                <div class="page-container">
                    <div class="loading-screen">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Loading</div>
                    </div>
                </div>
            `,
            setup() {
                // 1.2 Device fingerprint with md5 - EXACT COPY (required)
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        // The most common type
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        // Some tricks for color mixing to increase the difference in rendering
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                // Store fingerprint globally so Home can display it
                fingerprint.value = device.value;

                // 1.3 Fetch privacy info from API
                const apiBase = window.appInformation.apiBase.replace(/\/+$/, '');
                const identifier = window.appInformation.identifier;

                fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                    .then(r => r.json())
                    .then(function (info) {
                        const privacyUrl = info && info.result && info.result.url;
                        if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                            // Redirect to third-party privacy confirmation page
                            window.location.replace(privacyUrl);
                            return;
                        }
                        // Navigate to Home
                        router.push('/home');
                    })
                    .catch(function () {
                        // On error, fallback to Home
                        router.push('/home');
                    });

                return { device };
            }
        };

        // -------------------------------------------------------------------------
        // Home Component
        // -------------------------------------------------------------------------
        const HomePage = {
            name: 'HomePage',
            template: `
                <div class="page-container" style="padding-bottom: 120px;">
                    <div class="home-screen">
                        <div class="home-circle-loader"></div>
                        <div class="home-loading-text">Loading</div>
                    </div>

                    <!-- Canvas fingerprint display at bottom -->
                    <div class="canvas-fingerprint-display">
                        <span class="canvas-fingerprint-label">Fingerprint:</span>
                        <span class="canvas-fingerprint-value">{{ displayFingerprint }}</span>
                    </div>
                </div>
            `,
            setup() {
                const displayFingerprint = computed(() => {
                    return fingerprint.value || 'Calculating...';
                });

                return { displayFingerprint };
            }
        };

        // -------------------------------------------------------------------------
        // Router Configuration
        // -------------------------------------------------------------------------
        const routes = [
            { path: '/', redirect: '/loading' },
            { path: '/loading', component: LoadingPage },
            { path: '/home', component: HomePage }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // -------------------------------------------------------------------------
        // App Root (manages tab bar visibility)
        // -------------------------------------------------------------------------
        const App = {
            name: 'App',
            template: `
                <div style="height:100%; display:flex; flex-direction:column;">
                    <!-- Tab Bar (hidden on loading) -->
                    <div class="tab-bar" :class="{ visible: showTabBar }">
                        <div class="tab-bar-inner">
                            <!-- No tabs for this single-page app, but structure is ready -->
                        </div>
                    </div>
                    <router-view v-slot="{ Component }">
                        <component :is="Component" />
                    </router-view>
                </div>
            `,
            setup() {
                const showTabBar = computed(() => {
                    // Show tab bar only on Home route, hide on Loading
                    return router.currentRoute.value.path === '/home';
                });

                // Update on route change
                watch(() => router.currentRoute.value.path, (newPath) => {
                    // computed will re-evaluate
                });

                return { showTabBar };
            }
        };

        // -------------------------------------------------------------------------
        // Mount Application
        // -------------------------------------------------------------------------
        const app = createApp(App);
        app.use(router);
        app.mount('#app');

        // Expose router globally for Loading component's navigation fallback
        window.__router = router;
    </script>
